<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1040" height="600" fill="#ffffff"/>
<text x="520.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0c0f14">The build-up ladder — start simple, climb one rung at a time</text>
<text x="520.0" y="56" text-anchor="middle" font-size="12.5" fill="#5B6770">Every engagement starts at the lowest rung that delivers standalone value (the MVP). Each rung adds one dial = one pricing adder = one package step.</text>
<rect x="40" y="470" width="176" height="120" rx="10" fill="#0c0f14" stroke="#0c0f14" stroke-width="1.6"/>
<text x="54" y="496" font-size="12" font-weight="700" fill="#9fc6ee">L0 · Basic</text>
<text x="54" y="518" font-size="16" font-weight="700" fill="#ffffff">Capture</text>
<text x="54" y="540" font-size="10.5" fill="#c9d6e6">arrives → log · route · notify</text>
<text x="54" y="580" font-size="10" fill="#c9d6e6">risk: low  ·  human gate stays</text>
<path d="M 216 530.0 H 226 " stroke="#7a828f" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 216 530.0 V 460.0" stroke="#7a828f" stroke-width="1.6"/>
<rect x="226" y="400" width="176" height="120" rx="10" fill="#eef1f6" stroke="#c2cbd8" stroke-width="1.6"/>
<text x="240" y="426" font-size="12" font-weight="700" fill="#2E75B6">L1 · Pro</text>
<text x="240" y="448" font-size="16" font-weight="700" fill="#0c0f14">Triage</text>
<text x="240" y="470" font-size="10.5" fill="#5B6770">+ classify + drafted reply</text>
<text x="240" y="485" font-size="10.5" fill="#5B6770">(held)</text>
<text x="240" y="510" font-size="10" fill="#7a828f">risk: medium  ·  human gate stays</text>
<path d="M 402 460.0 H 412 " stroke="#7a828f" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 402 460.0 V 390.0" stroke="#7a828f" stroke-width="1.6"/>
<rect x="412" y="330" width="176" height="120" rx="10" fill="#eef1f6" stroke="#c2cbd8" stroke-width="1.6"/>
<text x="426" y="356" font-size="12" font-weight="700" fill="#2E75B6">L2 · Pro</text>
<text x="426" y="378" font-size="16" font-weight="700" fill="#0c0f14">Multi-branch</text>
<text x="426" y="400" font-size="10.5" fill="#5B6770">+ several checks / decisions,</text>
<text x="426" y="415" font-size="10.5" fill="#5B6770">route to owners</text>
<text x="426" y="440" font-size="10" fill="#7a828f">risk: medium  ·  human gate stays</text>
<path d="M 588 390.0 H 598 " stroke="#7a828f" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 588 390.0 V 320.0" stroke="#7a828f" stroke-width="1.6"/>
<rect x="598" y="260" width="176" height="120" rx="10" fill="#eef1f6" stroke="#c2cbd8" stroke-width="1.6"/>
<text x="612" y="286" font-size="12" font-weight="700" fill="#2E75B6">L3 · Managed</text>
<text x="612" y="308" font-size="16" font-weight="700" fill="#0c0f14">Managed</text>
<text x="612" y="330" font-size="10.5" fill="#5B6770">+ monitoring · reporting ·</text>
<text x="612" y="345" font-size="10.5" fill="#5B6770">CRM · scheduled runs</text>
<text x="612" y="370" font-size="10" fill="#7a828f">risk: low–med  ·  human gate stays</text>
<path d="M 774 320.0 H 784 " stroke="#7a828f" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 774 320.0 V 250.0" stroke="#7a828f" stroke-width="1.6"/>
<rect x="784" y="190" width="176" height="120" rx="10" fill="#e7f3ea" stroke="#4a9d68" stroke-width="1.6"/>
<text x="798" y="216" font-size="12" font-weight="700" fill="#2E75B6">L4 · Agentic*</text>
<text x="798" y="238" font-size="16" font-weight="700" fill="#0c0f14">Agentic</text>
<text x="798" y="260" font-size="10.5" fill="#5B6770">+ bounded multi-step actions</text>
<text x="798" y="275" font-size="10.5" fill="#5B6770">(guardrailed)</text>
<text x="798" y="300" font-size="10" fill="#7a828f">risk: high  ·  human gate stays</text>
<text x="968" y="244.0" font-size="11" fill="#5B6770">→ beyond:</text>
<text x="968" y="260.0" font-size="11" fill="#5B6770">out of shape</text>
<text x="40" y="560" font-size="11.5" fill="#5B6770">Start rung = Phase 2 MVP (Yes / Later / No).  Climb rungs = Phase 6 expansion backlog.  * Agentic is the edge of our shape; autonomous / real-time / one-off migration is out.</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#7a828f"/></marker></defs>
</svg>