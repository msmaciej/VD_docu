<svg width="900" height="660" viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>VortexDeep automation fit matrix (internal reference)</title>
<desc>A 2x2 matrix of four automation-fit profiles — FireFight, Refine, Build, and Optimize — plotted against time cost (urgent vs manageable) and process clarity (no/partial vs full process).</desc>

<rect x="0" y="0" width="900" height="660" fill="#F9F7F2"/>

<text x="450" y="42" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="16" letter-spacing="2" fill="#1A1A18">VORTEXDEEP — AUTOMATION FIT MATRIX</text>
<text x="450" y="66" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#A33020">INTERNAL REFERENCE — NOT FOR PUBLIC OR CLIENT-FACING USE</text>

<line x1="170" y1="110" x2="170" y2="600" stroke="#B8B4A6" stroke-width="1"/>
<line x1="170" y1="600" x2="850" y2="600" stroke="#B8B4A6" stroke-width="1"/>

<text x="60" y="220" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#5F5D54" transform="rotate(-90 60 220)">URGENT TIME COST</text>
<text x="60" y="440" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#5F5D54" transform="rotate(-90 60 440)">MANAGEABLE TIME COST</text>

<text x="332" y="628" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#5F5D54">NO / PARTIAL PROCESS</text>
<text x="657" y="628" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#5F5D54">FULL PROCESS</text>

<line x1="495" y1="110" x2="495" y2="600" stroke="#D8D4C6" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="170" y1="330" x2="850" y2="330" stroke="#D8D4C6" stroke-width="1" stroke-dasharray="3 4"/>

<g>
  <rect x="170" y="110" width="325" height="220" fill="#F3F0E7" stroke="#C9C5B8" stroke-width="1"/>
  <text x="332" y="160" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="22" font-weight="bold" fill="#1A1A18">FireFight</text>
  <text x="332" y="200" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="13" fill="#3D3D3A">
    <tspan x="332" dy="0">Real hours lost firefighting —</tspan>
    <tspan x="332" dy="20">no process to fall back on.</tspan>
    <tspan x="332" dy="20">Usually the fastest ROI</tspan>
    <tspan x="332" dy="20">from automating.</tspan>
  </text>
</g>

<g>
  <rect x="495" y="110" width="325" height="220" fill="#F3F0E7" stroke="#C9C5B8" stroke-width="1"/>
  <text x="657" y="160" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="22" font-weight="bold" fill="#1A1A18">Refine</text>
  <text x="657" y="200" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="13" fill="#3D3D3A">
    <tspan x="657" dy="0">A process already exists —</tspan>
    <tspan x="657" dy="20">it just needs to run faster</tspan>
    <tspan x="657" dy="20">and more consistently.</tspan>
  </text>
</g>

<g>
  <rect x="170" y="330" width="325" height="220" fill="#F3F0E7" stroke="#C9C5B8" stroke-width="1"/>
  <text x="332" y="380" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="22" font-weight="bold" fill="#1A1A18">Build</text>
  <text x="332" y="420" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="13" fill="#3D3D3A">
    <tspan x="332" dy="0">Manageable for now, but no</tspan>
    <tspan x="332" dy="20">process underneath. Worth</tspan>
    <tspan x="332" dy="20">addressing before it grows.</tspan>
  </text>
</g>

<g>
  <rect x="495" y="330" width="325" height="220" fill="#F3F0E7" stroke="#C9C5B8" stroke-width="1"/>
  <text x="657" y="380" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="22" font-weight="bold" fill="#1A1A18">Optimize</text>
  <text x="657" y="420" text-anchor="middle" font-family="'Space Mono', 'SF Mono', ui-monospace, monospace" font-size="13" fill="#3D3D3A">
    <tspan x="657" dy="0">Already solid — process and</tspan>
    <tspan x="657" dy="20">time both under control.</tspan>
    <tspan x="657" dy="20">Room for fine-tuning.</tspan>
  </text>
</g>
</svg>
