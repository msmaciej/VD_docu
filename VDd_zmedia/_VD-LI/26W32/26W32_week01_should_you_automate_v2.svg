ints="600.0,138.0 626.0,153.0 626.0,183.0 600.0,198.0 574.0,183.0 574.0,153.0" fill="none" stroke="#9fb0ba" stroke-width="2.1" stroke-linejoin="round"/><circle cx="600.0" cy="138.0" r="3" fill="#9fb0ba"/><circle cx="626.0" cy="153.0" r="3" fill="#9fb0ba"/><circle cx="626.0" cy="183.0" r="3" fill="#9fb0ba"/><circle cx="600.0" cy="198.0" r="3" fill="#9fb0ba"/><circle cx="574.0" cy="183.0" r="3" fill="#9fb0ba"/><circle cx="574.0" cy="153.0" r="3" fill="#9fb0ba"/><text x="600" y="176" text-anchor="middle" font-family="DejaVu Serif" font-size="24" fill="#eef0eb">VD</text><text x='600' y='270' text-anchor='middle' font-family='DejaVu Serif' font-size='25' fill='#7fd8c4' letter-spacing='9'>A QUICK CHECK</text><text x='600' y='356' text-anchor='middle' font-family='DejaVu Serif' font-size='74' fill='#e6e8e3' letter-spacing='6'>SHOULD YOU</text><text x='600' y='436' text-anchor='middle' font-family='DejaVu Serif' font-size='74' fill='#e6e8e3' letter-spacing='6'>AUTOMATE IT?</text><text x='600' y='530' text-anchor='middle' font-family='DejaVu Serif' font-size='27' fill='#9aa2ab' font-style='italic'>Three checks before you hand a task to AI.</text><circle cx="232" cy="613" r="26" fill="url(#halo)"/><circle cx="232" cy="613" r="9" fill="#7fd8c4"/><text x='286' y='626' font-family='DejaVu Serif' font-size='34' fill='#eaece7' letter-spacing='0.4'>Is it repetitive and rule-based?</text><text x='286' y='668' font-family='DejaVu Serif' font-size='26' fill='#aab3bc'>If it needs judgment every time,</text><text x='286' y='704' font-family='DejaVu Serif' font-size='26' fill='#aab3bc'>automate the prep — not the decision.</text><circle cx="232" cy="767" r="26" fill="url(#halo)"/><circle cx="232" cy="767" r="9" fill="#7fd8c4"/><text x='286' y='780' font-family='DejaVu Serif' font-size='34' fill='#eaece7' letter-spacing='0.4'>What's the cost of a mistake?</text><text x='286' y='822' font-family='DejaVu Serif' font-size='26' fill='#aab3bc'>High stakes? Keep a human on the approval step.</text><circle cx="232" cy="889" r="26" fill="url(#halo)"/><circle cx="232" cy="889" r="9" fill="#7fd8c4"/><text x='286' y='902' font-family='DejaVu Serif' font-size='34' fill='#eaece7' letter-spacing='0.4'>Does the data need to stay in-house?</text><text x='286' y='944' font-family='DejaVu Serif' font-size='26' fill='#aab3bc'>If yes, no black boxes. Your data stays yours.</text><line x1='390' y1='1018' x2='810' y2='1018' stroke='#ffffff' stroke-opacity='0.09'/><circle cx="600" cy="1018" r="20" fill="url(#halo)"/><circle cx="600" cy="1018" r="7" fill="#7fd8c4"/><text x='600' y='1082' text-anchor='middle' font-family='DejaVu Serif' font-size='24' fill='#9aa2ab' letter-spacing='2'>vortexdeep.ch · human-in-the-loop AI automation</text></svg>